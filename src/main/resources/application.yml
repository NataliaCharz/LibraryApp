server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: "libraryapp"
    key-store-type: PKCS12
    key-alias: springboot

spring:
  application:
    name: "bookcase"
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

logging:
  level:
    org:
      hibernate:
        sql: DEBUG
      springframework:
        web: INFO
        security: TRACE
        jdbc:
          datasource.init.ScriptUtils: DEBUG
        boot:
          autoconfigure.sql.init: DEBUG

library:
  baseUrl: "https://openlibrary.org"
  path: "/search.json"
  fields: "title, author_name"
