server:
  port: 8090

spring:
  application:
    name: "bookcase"
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
        mode: always
#  autoconfigure:
#    exclude: org.springframework.boot.autoconfigure.security.SecurityAutoConfiguration

logging:
  level:
    org:
      hibernate:
        sql: DEBUG
      springframework:
        web: INFO
        security: TRACE
        jdbc:
          datasource.init.ScriptUtils: DEBUG
        boot:
          autoconfigure.sql.init: DEBUG

library:
  baseUrl: "https://openlibrary.org"
  path: "/search.json"
  fields: "title, author_name"

